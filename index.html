<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>YT wallpaper</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{position:absolute;top:50%;left:50%;width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;transform:translate(-50%,-50%);border:0;pointer-events:none}</style>
</head><body>
<script>
const p=new URLSearchParams(location.search);const v=p.get("v")||"U3kEvS-42OM";const live=p.has("live");
const q=new URLSearchParams({autoplay:"1",controls:"0",mute:p.get("mute")||"0",playsinline:"1",rel:"0"});
if(!live){q.set("loop","1");q.set("playlist",v);}
const f=document.createElement("iframe");
f.src="https://www.youtube.com/embed/"+encodeURIComponent(v)+"?"+q;
f.allow="autoplay; encrypted-media";f.referrerPolicy="strict-origin-when-cross-origin";
document.body.appendChild(f);
</script></body></html>
